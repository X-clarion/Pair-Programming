<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Quiz Challenge</title>
  <link rel="stylesheet" href="style.css">
  <script src="quiz.js" defer></script>
</head>
<body>
  <main class="quiz-card">
    <header class="quiz-header">
      <div>
        <p class="eyebrow">Practice your math</p>
        <h1>Math Quiz Challenge</h1>
      </div>
      <div id="score" class="score" aria-live="polite" hidden>0/10 correct</div>
    </header>

    <section id="start-screen">
      <p>Choose a difficulty to start a 10-question quiz.</p>
      <div class="difficulty-buttons">
        <button type="button" data-difficulty="beginner">Beginner <small>-50 to 50</small></button>
        <button type="button" data-difficulty="intermediate">Intermediate <small>-1,000 to 1,000</small></button>
        <button type="button" data-difficulty="advanced">Advanced <small>-10,000 to 10,000</small></button>
      </div>
    </section>

    <section id="question-screen" hidden>
      <p id="question-progress" class="progress"></p>
      <h2 id="question-text"></h2>
      <form id="answer-form">
        <label for="answer-input">Your answer</label>
        <input id="answer-input" type="number" step="any" required autocomplete="off" placeholder="Enter a number">
        <button type="submit" id="submit-button">Submit answer</button>
      </form>
      <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      <button type="button" id="next-button" hidden>Next question</button>
    </section>

    <section id="result-screen" hidden>
      <h2>Quiz complete!</h2>
      <p id="result-text" class="result-text"></p>
      <button type="button" id="retry-button">Try again</button>
      <button type="button" id="change-button" class="secondary">Change difficulty</button>
    </section>
  </main>
</body>
</html>
